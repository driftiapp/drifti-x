apiVersion: v1
kind: Secret
metadata:
  name: {{ include "driftix.fullname" . }}-secrets
  labels:
    {{- include "driftix.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  EMAIL_USER: {{ .Values.secrets.emailUser | b64enc | quote }}
  EMAIL_PASS: {{ .Values.secrets.emailPass | b64enc | quote }}
  IPINFO_TOKEN: {{ .Values.secrets.ipinfoToken | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  MONGODB_PASSWORD: {{ .Values.secrets.mongodbPassword | b64enc | quote }} 