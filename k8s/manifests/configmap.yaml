apiVersion: v1
kind: ConfigMap
metadata:
  name: driftix-config
data:
  NODE_ENV: "production"
  APP_URL: "http://driftix-service"
  CORS_ORIGIN: "http://driftix-service"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_FROM: "noreply@driftix.com" 