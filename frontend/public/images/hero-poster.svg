<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a00e0;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8e2de2;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#grad1)"/>
  
  <!-- Overlay gradient -->
  <rect width="1920" height="1080" fill="url(#grad2)"/>
  
  <!-- Abstract shapes -->
  <circle cx="960" cy="540" r="400" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="960" cy="540" r="300" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="960" cy="540" r="200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)"/>
</svg> 