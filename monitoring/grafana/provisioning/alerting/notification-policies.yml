apiVersion: 1

groups:
  - name: slack-worker-alerts
    folder: Slack Worker
    interval: 1m
    rules:
      - receiver: slack-critical
        group_by: ['alertname', 'service']
        match:
          severity: critical
        repeat_interval: 1h
        group_wait: 30s
        group_interval: 5m

      - receiver: slack-warning
        group_by: ['alertname', 'service']
        match:
          severity: warning
        repeat_interval: 2h
        group_wait: 1m
        group_interval: 10m

receivers:
  - name: slack-critical
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: '#alerts-critical'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }} - {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* {{ .Value }}
            {{ end }}
          {{ end }}

  - name: slack-warning
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: '#alerts-warning'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }} - {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* {{ .Value }}
            {{ end }}
          {{ end }} 