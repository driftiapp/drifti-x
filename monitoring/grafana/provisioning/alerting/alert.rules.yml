groups:
  - name: slack-worker
    rules:
      # Worker Health Alerts
      - alert: SlackWorkerDown
        expr: up{job="slack-worker"} == 0
        for: 1m
        labels:
          severity: critical
          service: slack-worker
        annotations:
          summary: Slack worker is down
          description: Slack worker instance {{ $labels.instance }} has been down for more than 1 minute

      # Queue Alerts
      - alert: HighQueueBacklog
        expr: slack_queue_size > 100
        for: 5m
        labels:
          severity: warning
          service: slack-worker
        annotations:
          summary: High queue backlog
          description: Slack worker queue has more than 100 pending jobs for 5 minutes

      - alert: CriticalQueueBacklog
        expr: slack_queue_size > 500
        for: 5m
        labels:
          severity: critical
          service: slack-worker
        annotations:
          summary: Critical queue backlog
          description: Slack worker queue has more than 500 pending jobs for 5 minutes

      # Job Performance Alerts
      - alert: HighJobFailureRate
        expr: rate(slack_job_failed_total[5m]) / rate(slack_job_completed_total[5m]) * 100 > 10
        for: 5m
        labels:
          severity: warning
          service: slack-worker
        annotations:
          summary: High job failure rate
          description: More than 10% of Slack jobs are failing

      - alert: CriticalJobFailureRate
        expr: rate(slack_job_failed_total[5m]) / rate(slack_job_completed_total[5m]) * 100 > 30
        for: 5m
        labels:
          severity: critical
          service: slack-worker
        annotations:
          summary: Critical job failure rate
          description: More than 30% of Slack jobs are failing

      # Processing Time Alerts
      - alert: HighJobProcessingTime
        expr: rate(slack_job_duration_seconds_sum[5m]) / rate(slack_job_duration_seconds_count[5m]) > 5
        for: 5m
        labels:
          severity: warning
          service: slack-worker
        annotations:
          summary: High job processing time
          description: Average job processing time is above 5 seconds

      - alert: CriticalJobProcessingTime
        expr: rate(slack_job_duration_seconds_sum[5m]) / rate(slack_job_duration_seconds_count[5m]) > 10
        for: 5m
        labels:
          severity: critical
          service: slack-worker
        annotations:
          summary: Critical job processing time
          description: Average job processing time is above 10 seconds

      # Redis Health Alerts
      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: High Redis memory usage
          description: Redis memory usage is above 85% for 5 minutes

      - alert: RedisCriticalMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 95
        for: 5m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Critical Redis memory usage
          description: Redis memory usage is above 95% for 5 minutes 