groups:
  - name: system
    rules:
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High memory usage on {{ $labels.instance }}
          description: Memory usage is above 85% for 5 minutes

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High CPU usage on {{ $labels.instance }}
          description: CPU usage is above 80% for 5 minutes

  - name: redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis is down
          description: Redis instance {{ $labels.instance }} is down

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High Redis memory usage
          description: Redis memory usage is above 85% for 5 minutes

  - name: slack-worker
    rules:
      - alert: SlackWorkerDown
        expr: up{job="slack-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Slack worker is down
          description: Slack worker instance {{ $labels.instance }} is down

      - alert: HighJobFailureRate
        expr: rate(slack_job_failed_total[5m]) / rate(slack_job_completed_total[5m]) * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High job failure rate
          description: More than 10% of Slack jobs are failing 